name: 🐍 Contribution Snake

on:
  schedule:
    # 02:00 UTC daily (07:30 IST)
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from the contribution grid
        uses: Platane/snk@v3.5.0
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Brass ramp, matching the portfolio palette.
          # color_dots order: 0 contributions -> highest.
          outputs: |
            dist/snake.svg?color_snake=#8a6427&color_dots=#ebedf0,#e8d0a0,#c99a44,#a9803f,#8a6427
            dist/snake-dark.svg?color_snake=#ffcf5c&color_dots=#0e1726,#5c4519,#8a6427,#c99a44,#ffcf5c

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
