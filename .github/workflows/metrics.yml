name: 📊 Ship's Log — Metrics

on:
  schedule:
    # 03:00 UTC every Sunday
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Render metrics
        uses: lowlighter/metrics@v3.34
        with:
          # Needs a classic PAT with `public_repo` + `read:user`, stored as METRICS_TOKEN.
          # The built-in GITHUB_TOKEN cannot read cross-repo contribution data.
          token: ${{ secrets.METRICS_TOKEN }}
          user: Milan-Baldaniya
          filename: assets/metrics.svg
          template: classic
          base: header, repositories
          config_timezone: Asia/Kolkata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: all

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact

          # Brass-on-ink-navy, matching assets/banner.svg and the portfolio.
          extras_css: |
            svg, .container { background: #06101c !important; }
            h2, .title { color: #ffcf5c !important; }
            h2 { border-bottom: 1px solid #8a6427 !important; }
            .field, .row, p, span, li, td, text, tspan {
              color: #f0cf95 !important;
              fill: #f0cf95 !important;
            }
            a, a:hover { color: #ffcf5c !important; }
            .no-datas, .cake { color: #a9803f !important; }
            svg foreignObject { color: #f0cf95; }
