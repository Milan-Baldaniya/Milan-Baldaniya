<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="The 3D contribution calendar is generated by a scheduled GitHub Action.">
  <defs>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6427" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffcf5c"/>
      <stop offset="100%" stop-color="#8a6427" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="120" rx="10" fill="#06101c" stroke="#8a6427" stroke-width="1"/>
  <rect x="80" y="40" width="740" height="1.5" fill="url(#b3)"/>
  <text x="450" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="4" fill="#ffcf5c">PLOTTING THE ISOMETRIC CHART</text>
  <text x="450" y="94" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" fill="#a9803f">Refreshed nightly by the 3D Contribution Calendar workflow.</text>
</svg>
