<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Wanted: Captain Milan, The AI Voyager. Bounty 3,000,000,000 berries. Full-Stack AI and LLM Application Engineer, Surat, Gujarat, India.">
  <title>Captain Milan — The AI Voyager</title>

  <defs>
    <radialGradient id="ground" cx="50%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#14314d"/>
      <stop offset="52%" stop-color="#06101c"/>
      <stop offset="100%" stop-color="#030a12"/>
    </radialGradient>

    <linearGradient id="paper" x1="0%" y1="0%" x2="18%" y2="100%">
      <stop offset="0%" stop-color="#fbf1da"/>
      <stop offset="45%" stop-color="#f4e4c1"/>
      <stop offset="100%" stop-color="#e8d0a0"/>
    </linearGradient>

    <linearGradient id="brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0cf95"/>
      <stop offset="55%" stop-color="#a9803f"/>
      <stop offset="100%" stop-color="#8a6427"/>
    </linearGradient>

    <!-- aged fibre texture; decorative only, degrades to flat paper -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>

    <radialGradient id="age" cx="50%" cy="50%" r="72%">
      <stop offset="52%" stop-color="#6a4718" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6a4718" stop-opacity="0.36"/>
    </radialGradient>

    <path id="tear" d="M84 28 L173 22 L262 28 L358 21 L451 27 L547 21 L640 27 L736 22 L829 28 L921 22 L1014 28 L1116 24
      L1120 130 L1115 250 L1119 350 L1117 374
      L1022 371 L928 377 L833 370 L739 377 L644 369 L548 377 L453 370 L357 377 L263 370 L168 376 L82 372
      L86 260 L81 145 Z"/>

    <clipPath id="tearClip"><use href="#tear"/></clipPath>
  </defs>

  <rect width="1200" height="400" fill="url(#ground)"/>

  <!-- faint chart rules, like latitude lines on a sea map -->
  <g stroke="#9ddce9" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
  </g>

  <use href="#tear" fill="#000" opacity="0.55" transform="translate(0,8)"/>
  <use href="#tear" fill="url(#paper)"/>
  <g clip-path="url(#tearClip)">
    <rect x="70" y="12" width="1060" height="380" filter="url(#grain)" opacity="0.5"/>
    <rect x="70" y="12" width="1060" height="380" fill="url(#age)"/>
  </g>
  <use href="#tear" fill="none" stroke="#8a6427" stroke-opacity="0.55" stroke-width="2"/>

  <!-- compass rose watermark, faint enough to read as paper texture -->
  <g transform="translate(600 208)" stroke="#6a4718" fill="none" opacity="0.09">
    <circle r="128" stroke-width="1.5"/>
    <circle r="104" stroke-width="1"/>
    <circle r="34" stroke-width="1"/>
    <g stroke-width="1.2">
      <path d="M0-128 L26-26 L128 0 L26 26 L0 128 L-26 26 L-128 0 L-26-26 Z"/>
      <path d="M0-128 L0 128 M-128 0 L128 0"/>
      <path d="M-90-90 L90 90 M90-90 L-90 90" stroke-opacity="0.55"/>
    </g>
  </g>

  <rect x="99" y="46" width="1002" height="308" fill="none" stroke="url(#brass)" stroke-width="3"/>
  <rect x="106" y="53" width="988" height="294" fill="none" stroke="#8a6427" stroke-opacity="0.45" stroke-width="1"/>

  <g fill="url(#brass)" stroke="#6a4718" stroke-width="1">
    <circle cx="118" cy="65" r="5"/><circle cx="1082" cy="65" r="5"/>
    <circle cx="118" cy="335" r="5"/><circle cx="1082" cy="335" r="5"/>
  </g>

  <text x="600" y="112" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Nimbus Roman', serif"
        font-size="60" font-weight="700" letter-spacing="26" fill="#2f2109">WANTED</text>

  <g stroke="#8a6427" stroke-width="2" stroke-linecap="round">
    <line x1="250" y1="132" x2="562" y2="132"/>
    <line x1="638" y1="132" x2="950" y2="132"/>
  </g>
  <path d="M600 124 L609 132 L600 140 L591 132 Z" fill="#a9803f"/>

  <text x="600" y="190" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Nimbus Roman', serif"
        font-size="52" font-weight="700" letter-spacing="6" fill="#2f2109">CAPTAIN MILAN</text>

  <text x="600" y="222" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="21" font-style="italic" letter-spacing="4" fill="#6a4718">“ The AI Voyager ”</text>

  <text x="600" y="262" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" letter-spacing="7" fill="#8a6427">DEAD OR ALIVE   ·   BOUNTY</text>

  <!-- bounty figure: berry glyph (B struck through twice) + amount -->
  <g fill="#2f2109">
    <text x="432" y="306" font-family="Georgia, 'Times New Roman', serif"
          font-size="38" font-weight="700">B</text>
    <rect x="428" y="288" width="32" height="3" />
    <rect x="428" y="296" width="32" height="3" />
    <text x="474" y="306" font-family="Georgia, 'Times New Roman', serif"
          font-size="38" font-weight="700" letter-spacing="2">3,000,000,000</text>
  </g>

  <!-- footer plate -->
  <rect x="130" y="318" width="940" height="30" fill="#06101c" opacity="0.92"/>
  <rect x="130" y="318" width="940" height="30" fill="none" stroke="#a9803f" stroke-width="1"/>
  <text x="600" y="338" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="4" fill="#ffcf5c">FULL-STACK AI / LLM APPLICATION ENGINEER  ·  SURAT, GUJARAT, INDIA</text>
</svg>
