<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Milan Baldaniya — Full-Stack AI / LLM Application Engineer. RAG systems, multi-agent LLM pipelines, workflow automation. Next.js, FastAPI, Laravel, Supabase, pgvector, DeepSeek. Surat, Gujarat, India.">
  <title>Milan Baldaniya — Full-Stack AI / LLM Application Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2b"/>
      <stop offset="45%" stop-color="#06101c"/>
      <stop offset="100%" stop-color="#030a12"/>
    </linearGradient>

    <radialGradient id="glow" cx="76%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#ffcf5c" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#a9803f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06101c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcf5c"/>
      <stop offset="100%" stop-color="#8a6427"/>
    </linearGradient>

    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf5c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a9803f" stop-opacity="0.18"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#9ddce9" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" fill="url(#bg)"/>
  <rect width="1200" height="330" fill="url(#grid)"/>
  <rect width="1200" height="330" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="5" height="330" fill="url(#accent)"/>

  <!-- ── knowledge-graph motif: nodes and edges, the shape of retrieval ── -->
  <g stroke="url(#edge)" stroke-width="1.1" fill="none">
    <path d="M900 165 L800 100 M900 165 L880 78 M900 165 L975 92 M900 165 L830 190
             M900 165 L975 175 M900 165 L960 245 M900 165 L880 262 M900 165 L745 160"/>
    <path d="M975 92 L1055 72 M975 92 L1060 140 M1060 140 L1120 100 M1060 140 L975 175
             M1060 140 L1115 200 M975 175 L1045 235 M960 245 L1045 235 M960 245 L880 262
             M790 245 L830 190 M790 245 L745 160 M790 245 L880 262 M1045 235 L1115 200
             M1115 200 L1130 262 M1055 72 L1120 100"/>
  </g>

  <!-- retrieval radius -->
  <g fill="none" stroke="#ffcf5c" stroke-opacity="0.10">
    <circle cx="900" cy="165" r="46"/>
    <circle cx="900" cy="165" r="88" stroke-opacity="0.06"/>
    <circle cx="900" cy="165" r="132" stroke-opacity="0.04"/>
  </g>

  <g fill="#a9803f">
    <circle cx="800" cy="100" r="4"/><circle cx="880" cy="78" r="3.5"/>
    <circle cx="1055" cy="72" r="3.5"/><circle cx="745" cy="160" r="4"/>
    <circle cx="830" cy="190" r="4.5"/><circle cx="1120" cy="100" r="3.5"/>
    <circle cx="790" cy="245" r="4"/><circle cx="880" cy="262" r="3.5"/>
    <circle cx="1045" cy="235" r="4"/><circle cx="1130" cy="262" r="3"/>
  </g>
  <g fill="#ffcf5c">
    <circle cx="975" cy="92" r="5"/><circle cx="975" cy="175" r="5"/>
    <circle cx="1060" cy="140" r="6"/><circle cx="960" cy="245" r="5"/>
    <circle cx="1115" cy="200" r="4.5"/>
  </g>
  <circle cx="900" cy="165" r="8" fill="#ffcf5c"/>
  <circle cx="900" cy="165" r="14" fill="none" stroke="#ffcf5c" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- ── type ── -->
  <text x="72" y="104"
        font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="15" font-weight="600" letter-spacing="5" fill="#a9803f">FULL-STACK AI / LLM APPLICATION ENGINEER</text>

  <text x="72" y="172"
        font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="1.5" fill="#f4e4c1">MILAN BALDANIYA</text>

  <rect x="72" y="190" width="150" height="3" fill="url(#accent)"/>

  <text x="72" y="232"
        font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="19.5" fill="#f0cf95">RAG systems · Multi-agent LLM pipelines · Workflow automation</text>

  <text x="72" y="262"
        font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="16" fill="#8a6427">Next.js · FastAPI · Laravel · Supabase / pgvector · DeepSeek</text>

  <!-- location -->
  <g transform="translate(72 284)">
    <path d="M6 0 C2.7 0 0 2.7 0 6 C0 10.5 6 16 6 16 S12 10.5 12 6 C12 2.7 9.3 0 6 0 Z M6 8.2 A2.2 2.2 0 1 1 6 3.8 A2.2 2.2 0 0 1 6 8.2 Z" fill="#8a6427"/>
    <text x="20" y="13"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="15.5" letter-spacing="0.5" fill="#a9803f">Surat, Gujarat, India</text>
  </g>
</svg>
